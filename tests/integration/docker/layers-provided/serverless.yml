service: docker-layer-provided-tests

configValidationMode: error
deprecationNotificationMode: error

plugins:
  - ../../../../src/index.js

provider:
  architecture: x86_64
  deploymentMethod: direct
  memorySize: 1024
  name: aws
  region: us-east-1
  runtime: provided
  stage: dev
  versionFunctions: false

custom:
  serverless-offline:
    localLayers:
      "arn:aws:lambda:us-east-1:123456789012:layer:custom-runtime:1": local-layer
    noTimeout: true
    useDocker: true

functions:
  hello:
    events:
      - http:
          method: get
          path: hello
    handler: handler.hello
    layers:
      - arn:aws:lambda:us-east-1:123456789012:layer:custom-runtime:1
